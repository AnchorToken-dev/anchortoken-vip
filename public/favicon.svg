<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark Industrial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2d34" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>
    
    <!-- Copper & Verdigris Metallic Gradient -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="30%" stop-color="#a67c00" />
      <stop offset="70%" stop-color="#bf953f" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- 3D Drop Shadow Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    
    <!-- Subtle Circuit Board Pattern Overlay -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 20 M20 0 L20 40 M10 10 L10 15 L15 15" stroke="#000" stroke-width="1" stroke-opacity="0.3" fill="none"/>
      <circle cx="15" cy="15" r="2" fill="#000" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="url(#copper)" stroke-opacity="0.5" stroke-width="6"/>

  <!-- Anchor Shape with Shadow & Metallic Gradient -->
  <g filter="url(#shadow)">
    <!-- Main Anchor Body -->
    <circle cx="256" cy="124" r="30" fill="none" stroke="url(#copper)" stroke-width="26"/>
    <rect x="148" y="178" width="216" height="24" rx="12" fill="url(#copper)"/>
    <path d="M 256 200 L 256 330 C 256 392 198 412 150 388 L 114 352 M 256 330 C 256 392 314 412 362 388 L 398 352" stroke="url(#copper)" stroke-width="26" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>
    
    <!-- Pattern Overlay for Texture -->
    <circle cx="256" cy="124" r="30" fill="none" stroke="url(#circuit)" stroke-width="26"/>
    <rect x="148" y="178" width="216" height="24" rx="12" fill="url(#circuit)"/>
    <path d="M 256 200 L 256 330 C 256 392 198 412 150 388 L 114 352 M 256 330 C 256 392 314 412 362 388 L 398 352" stroke="url(#circuit)" stroke-width="26" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Brass Rivet Details on the Crossbar -->
  <circle cx="160" cy="190" r="6" fill="#eab308" filter="url(#shadow)"/>
  <circle cx="256" cy="190" r="6" fill="#eab308" filter="url(#shadow)"/>
  <circle cx="352" cy="190" r="6" fill="#eab308" filter="url(#shadow)"/>
</svg>
